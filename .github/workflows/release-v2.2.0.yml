name: Build CADCheckTool v2.2.0

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, generalized-tool]
    paths:
      - "**/*.cs"
      - "**/*.md"
      - "Correct_test1.csproj"
      - "Correct_test1.sln"
      - "app.config"
      - "packages.config"
      - "Installer/**"
      - ".editorconfig"
      - ".github/workflows/release-v2.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate repository text and structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $strictUtf8 = New-Object System.Text.UTF8Encoding($false, $true)
          $textExtensions = @(
            '.cs', '.md', '.txt', '.iss', '.xml', '.json',
            '.yml', '.yaml', '.config', '.csproj', '.sln', '.ps1'
          )
          $specialNames = @('.editorconfig', '.gitattributes', '.gitignore')
          $invalidFiles = [System.Collections.Generic.List[string]]::new()
          $garbledFiles = [System.Collections.Generic.List[string]]::new()
          $sensitiveFiles = [System.Collections.Generic.List[string]]::new()
          $garbledMarkers = @(
            ([string][char]0xFFFD),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('6ZSf5pak5ou3')),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('5rWj54qy44K9')),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('77+977+9'))
          )
          $sensitiveMarkers = @(
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('6K+65Y2H')),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('Wm9leS0wMzE0')),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('Wjpc5b2S5qGj5Zu+57q4')),
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('Wjpc5Zu+5Y+3566h55CGXOivuuWNh+agh+WHhuS7tue7n+S4gOWRveWQjS54bHN4'))
          )

          git ls-files | ForEach-Object {
            $relativePath = $_
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (-not (Test-Path $path -PathType Leaf)) { return }
            $extension = [System.IO.Path]::GetExtension($path).ToLowerInvariant()
            $name = [System.IO.Path]::GetFileName($path).ToLowerInvariant()
            if (($extension -notin $textExtensions) -and ($name -notin $specialNames)) { return }

            try {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $content = $strictUtf8.GetString($bytes)
              foreach ($marker in $garbledMarkers) {
                if ($content.Contains($marker)) {
                  $garbledFiles.Add($relativePath)
                  break
                }
              }
              foreach ($marker in $sensitiveMarkers) {
                if ($content.Contains($marker)) {
                  $sensitiveFiles.Add($relativePath)
                  break
                }
              }
            }
            catch {
              $invalidFiles.Add($relativePath)
            }
          }

          if ($invalidFiles.Count -gt 0) {
            throw ('Tracked text files must be valid UTF-8:' + [Environment]::NewLine + ($invalidFiles -join [Environment]::NewLine))
          }
          if ($garbledFiles.Count -gt 0) {
            throw ('Possible garbled text found:' + [Environment]::NewLine + ($garbledFiles -join [Environment]::NewLine))
          }
          if ($sensitiveFiles.Count -gt 0) {
            throw ('Company-specific or personal text found:' + [Environment]::NewLine + ($sensitiveFiles -join [Environment]::NewLine))
          }

          @(
            'Installer\CADCheckTool_v2.2.0.iss',
            'Installer\INSTALLATION_GUIDE.md',
            'Installer\RELEASE_NOTES_v2.2.0.md',
            'README.md',
            'ARCHITECTURE.md',
            'CONFIGURATION_GUIDE.md',
            'DEVELOPMENT_WORKFLOW.md',
            'GENERALIZATION_GUIDE.md'
          ) | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $hasUtf8Bom =
              $bytes.Length -ge 3 -and
              $bytes[0] -eq 0xEF -and
              $bytes[1] -eq 0xBB -and
              $bytes[2] -eq 0xBF
            if (-not $hasUtf8Bom) {
              throw "Release-critical text file must use UTF-8 BOM: $_"
            }
          }

          @(
            'InstallerLauncher',
            'PATCH_A3_A4_ANCHOR_OFFSET',
            'Installer\CADCheckToolInstaller.cs',
            'Installer\CADPluginRegistryManager.cs',
            'QuickRevision\Commands\QuickRevisionPickTestCommand.cs',
            'QuickRevision\Commands\ViewportPickTestCommand.cs',
            'Configs\StandardPartConfig.json',
            'index.html'
          ) | ForEach-Object {
            if (Test-Path (Join-Path $env:GITHUB_WORKSPACE $_)) {
              throw "Obsolete delivery file still exists: $_"
            }
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet dependencies
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Download AutoCAD 2024 build references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'autocad-packages'
          $apiDir = Join-Path $env:GITHUB_WORKSPACE '.autocad-api'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $apiDir | Out-Null
          nuget install AutoCAD.NET -Version 24.3.0 -OutputDirectory $packageRoot -ExcludeVersion -NonInteractive
          nuget install AutoCAD.NET.Model -Version 24.3.0 -OutputDirectory $packageRoot -ExcludeVersion -NonInteractive
          Copy-Item (Join-Path $packageRoot 'AutoCAD.NET\lib\net47\AcMgd.dll') $apiDir
          Copy-Item (Join-Path $packageRoot 'AutoCAD.NET.Core\lib\net47\AcCoreMgd.dll') $apiDir
          Copy-Item (Join-Path $packageRoot 'AutoCAD.NET.Model\lib\net47\AcDbMgd.dll') $apiDir
          @('AcMgd.dll', 'AcCoreMgd.dll', 'AcDbMgd.dll') | ForEach-Object {
            if (-not (Test-Path (Join-Path $apiDir $_))) {
              throw "Missing AutoCAD build reference: $_"
            }
          }

      - name: Build Release x64 plugin
        shell: pwsh
        run: |
          $apiDir = Join-Path $env:GITHUB_WORKSPACE '.autocad-api'
          msbuild Correct_test1.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:AutoCADApiDir="$apiDir"
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed.' }

      - name: Assemble AutoCAD bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'bin\x64\Release'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\bundle\CADCheckTool.bundle'
          $pluginDir = Join-Path $bundleRoot 'Contents\Windows'
          $docsDir = Join-Path $bundleRoot 'Docs'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          New-Item -ItemType Directory -Force -Path $docsDir | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Installer\PackageContents.xml') $bundleRoot
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Installer\INSTALLATION_GUIDE.md') $docsDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $docsDir

          $runtimeFiles = @(
            'CADCheckTool_1.dll',
            'CADCheckTool_1.dll.config',
            'EPPlus.dll',
            'Microsoft.IO.RecyclableMemoryStream.dll',
            'System.Buffers.dll',
            'System.ComponentModel.Annotations.dll',
            'System.Memory.dll',
            'System.Numerics.Vectors.dll',
            'System.Runtime.CompilerServices.Unsafe.dll',
            'System.Security.Cryptography.Xml.dll'
          )
          foreach ($file in $runtimeFiles) {
            $source = Join-Path $outputDir $file
            if (-not (Test-Path $source)) { throw "Release dependency is missing: $file" }
            Copy-Item $source $pluginDir
          }

      - name: Validate bundle contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\bundle\CADCheckTool.bundle'
          $pluginDir = Join-Path $bundleRoot 'Contents\Windows'
          $mainDll = Join-Path $pluginDir 'CADCheckTool_1.dll'
          $expectedFiles = @(
            'PackageContents.xml',
            'Docs\INSTALLATION_GUIDE.md',
            'Docs\LICENSE',
            'Contents\Windows\CADCheckTool_1.dll',
            'Contents\Windows\CADCheckTool_1.dll.config',
            'Contents\Windows\EPPlus.dll',
            'Contents\Windows\Microsoft.IO.RecyclableMemoryStream.dll',
            'Contents\Windows\System.Buffers.dll',
            'Contents\Windows\System.ComponentModel.Annotations.dll',
            'Contents\Windows\System.Memory.dll',
            'Contents\Windows\System.Numerics.Vectors.dll',
            'Contents\Windows\System.Runtime.CompilerServices.Unsafe.dll',
            'Contents\Windows\System.Security.Cryptography.Xml.dll'
          )
          $actualFiles = Get-ChildItem $bundleRoot -Recurse -File | ForEach-Object {
            $_.FullName.Substring($bundleRoot.Length + 1)
          }
          $difference = Compare-Object ($expectedFiles | Sort-Object) ($actualFiles | Sort-Object)
          if ($difference) {
            throw ('Bundle file whitelist mismatch:' + [Environment]::NewLine + ($difference | Out-String))
          }

          [xml]$manifest = Get-Content (Join-Path $bundleRoot 'PackageContents.xml') -Raw
          $requirements = $manifest.ApplicationPackage.Components.RuntimeRequirements
          if ($requirements.SeriesMin -ne 'R24.3' -or $requirements.SeriesMax -ne 'R24.3') {
            throw 'PackageContents.xml must target AutoCAD 2024 (R24.3) only.'
          }
          $component = $manifest.ApplicationPackage.Components.ComponentEntry
          if ($component.AppType -ne '.Net') {
            throw 'PackageContents.xml must explicitly declare the managed .Net component type.'
          }
          if ($component.LoadOnCommandInvocation -ne 'True' -or $component.LoadOnAutoCADStartup -ne 'False') {
            throw 'PackageContents.xml must register commands for on-demand loading.'
          }
          if ($component.HasAttribute('LoadReasons')) {
            throw 'PackageContents.xml must not use the unsupported LoadReasons attribute.'
          }
          $version = [Reflection.AssemblyName]::GetAssemblyName($mainDll).Version.ToString()
          if ($version -ne '2.2.0.0') { throw "Unexpected assembly version: $version" }

          function Test-ByteSequence {
            param([byte[]]$Buffer, [byte[]]$Pattern)
            for ($offset = 0; $offset -le $Buffer.Length - $Pattern.Length; $offset++) {
              $matches = $true
              for ($index = 0; $index -lt $Pattern.Length; $index++) {
                if ($Buffer[$offset + $index] -ne $Pattern[$index]) {
                  $matches = $false
                  break
                }
              }
              if ($matches) { return $true }
            }
            return $false
          }

          $assemblyBytes = [System.IO.File]::ReadAllBytes($mainDll)
          @(
            '单张检查',
            '批量检查',
            '当前没有打开CAD图纸。',
            '标准件库未收录',
            '序号错误：不在BOM中'
          ) | ForEach-Object {
            $expectedBytes = [System.Text.Encoding]::Unicode.GetBytes($_)
            if (-not (Test-ByteSequence -Buffer $assemblyBytes -Pattern $expectedBytes)) {
              throw "Compiled plug-in is missing expected Chinese text: $_"
            }
          }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc (Join-Path $env:GITHUB_WORKSPACE 'Installer\CADCheckTool_v2.2.0.iss')
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Create release ZIP and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release-package'
          $setupName = 'CADCheckTool_1_Setup_v2.2.0.exe'
          $zipName = 'CADCheckTool_1_v2.2.0_Windows_x64.zip'
          $checksumName = 'CADCheckTool_1_v2.2.0_SHA256.txt'
          $setupPath = Join-Path $releaseDir $setupName
          $zipPath = Join-Path $releaseDir $zipName
          $checksumPath = Join-Path $releaseDir $checksumName
          if (-not (Test-Path $setupPath)) { throw 'Inno Setup output is missing.' }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item $setupPath $packageDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'Installer\INSTALLATION_GUIDE.md') $packageDir
          $setupHash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $setupName" | Set-Content -Path $checksumPath -Encoding ascii
          Copy-Item $checksumPath $packageDir

          $packageFiles = Get-ChildItem $packageDir -File | Select-Object -ExpandProperty Name
          $expectedPackageFiles = @($setupName, 'INSTALLATION_GUIDE.md', $checksumName)
          if (Compare-Object ($expectedPackageFiles | Sort-Object) ($packageFiles | Sort-Object)) {
            throw 'Release ZIP staging directory contains unexpected files.'
          }
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $checksumPath -Value "$zipHash  $zipName" -Encoding ascii

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: CADCheckTool_1-v2.2.0-release
          path: |
            artifacts/release/CADCheckTool_1_Setup_v2.2.0.exe
            artifacts/release/CADCheckTool_1_v2.2.0_Windows_x64.zip
            artifacts/release/CADCheckTool_1_v2.2.0_SHA256.txt
            Installer/INSTALLATION_GUIDE.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish generalized v2.2.0 pre-release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/generalized-tool' && github.event.head_commit.message == 'Publish generalized v2.2.0 release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.0-generalized artifacts/release/CADCheckTool_1_Setup_v2.2.0.exe artifacts/release/CADCheckTool_1_v2.2.0_Windows_x64.zip artifacts/release/CADCheckTool_1_v2.2.0_SHA256.txt Installer/INSTALLATION_GUIDE.md --target "$env:GITHUB_SHA" --title "CADCheckTool v2.2.0 Generalized" --notes-file "Installer\RELEASE_NOTES_v2.2.0.md" --prerelease
